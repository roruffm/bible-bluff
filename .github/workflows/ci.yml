name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        timeout-minutes: 4
        run: npx playwright install chromium
      # Das Runner-Image bringt Chrome mit H.264/AAC bereits mit.
      - name: Check system Chrome
        run: google-chrome --version
      - name: Check Kids intro video playback
        run: npm run test:e2e -- e2e/kids-intro.spec.ts --max-failures=1
        env:
          CI: 'true'
      - name: Check Kids visual consistency
        run: npm run test:e2e -- e2e/kids-visual-consistency.spec.ts e2e/professor-motion.spec.ts --max-failures=1
        env:
          CI: 'true'
      - run: npm run test:e2e -- --max-failures=1 --grep-invert 'Erklärvideo:'
        env:
          CI: 'true'
