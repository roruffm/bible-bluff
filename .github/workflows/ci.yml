name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium chrome
      - name: Check Kids intro video playback
        run: npm run test:e2e -- e2e/kids-intro.spec.ts --max-failures=1
        env:
          CI: 'true'
      - name: Check Kids visual consistency
        run: npm run test:e2e -- e2e/kids-visual-consistency.spec.ts --max-failures=1
        env:
          CI: 'true'
      - run: npm run test:e2e -- --max-failures=1 --grep-invert 'Erklärvideo:'
        env:
          CI: 'true'
