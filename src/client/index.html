<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12324a" />
    <meta name="description" content="Bible Bluff – das Partyspiel fürs Handy: Bluffs erfinden, die Wahrheit finden, die Bibel entdecken." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bible Bluff" />
    <!-- Vorschau beim Teilen (WhatsApp, Signal, Telegram …). Für Einladungslinks /r/CODE tauscht der
         Worker Titel, Text und Bild aus (server/preview.ts) – dort dieselbe Schreibweise beibehalten. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bible Bluff" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:title" content="Bible Bluff – das Bibel-Partyspiel fürs Handy" />
    <meta property="og:description" content="Alle erfinden Antworten auf echte Bibelfragen – wer findet die richtige? Kostenlos und ohne Anmeldung, für Jugendgruppe, Hauskreis und Familie." />
    <meta property="og:image" content="https://biblebluff.de/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bible Bluff: Erfinde Bluffs. Finde die Wahrheit. Entdecke die Bibel." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Symbole unter neuen Namen seit dem Logo-Wechsel (scripts/render-icons.mjs, alte Namen: public/_redirects) -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icons/bible-bluff.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/bible-bluff-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Bible Bluff</title>
    <script>
      // Farbkonzept vor dem ersten Bild setzen, damit nichts aufblitzt (Prüfung und Rest: lib/theme.ts).
      // Ohne Wahl gilt See Genezareth; Lernblatt braucht kein data-theme.
      var t = 'see';
      try {
        t = new URLSearchParams(location.search).get('farbe') || localStorage.getItem('bible-bluff:v1:theme') || t;
      } catch (e) {}
      if (t !== 'lernblatt') document.documentElement.setAttribute('data-theme', t);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Bible Bluff braucht JavaScript.</noscript>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
