name = "bible-bluff"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# `wrangler deploy` (auch in Cloudflares Git-Anbindung „Workers Builds“) baut die App zuerst selbst.
[build]
command = "npm run build"
watch_dir = "src/client"

# Die gebaute App (vite build) wird als statische Assets ausgeliefert.
# Unbekannte Pfade wie /r/LAMPE7 landen in der Single-Page-App.
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# D1-Datenbank „bible-bluff“ (Region Westeuropa). Für ein eigenes Konto:
# `npx wrangler d1 create bible-bluff` ausführen und die ausgegebene database_id hier eintragen.
[[d1_databases]]
binding = "DB"
database_name = "bible-bluff"
database_id = "5f26ee8a-b917-453f-be71-9f23b2eba515"
migrations_dir = "migrations"

[observability]
enabled = true
